<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decentralized Twitter</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

<div class="max-w-2xl mx-auto bg-white shadow-md p-6 rounded-lg">
  <h1 class="text-2xl font-bold mb-4 text-center">🕊 Decentralized Twitter</h1>

  <div class="text-center mb-4">
    <button id="connectBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">Connect Wallet</button>
    <p id="account" class="mt-2 text-gray-700"></p>
  </div>

  <div class="mb-4">
    <textarea id="tweetContent" rows="3" placeholder="Write your tweet..."
      class="w-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
    <button id="tweetBtn" class="mt-2 bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">Tweet</button>
  </div>

  <hr class="my-4">

  <div id="tweetsContainer" class="space-y-4">
    <p class="text-gray-500 text-center">No tweets yet</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
